<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Mirror</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --navy: #18324a;
    --blue: #426b88;
    --cream: #f7f3ea;
    --paper: #eee8da;
    --yellow: #e8c85a;
    --soft-yellow: #f4df8c;
    --white: #fffdf8;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.75), transparent 28%),
      radial-gradient(circle at 80% 85%, rgba(232,200,90,.10), transparent 25%),
      var(--cream);
    color: var(--navy);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    font: inherit;
  }

  .page {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    position: relative;
    overflow: hidden;
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .06;
    z-index: 20;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(24,50,74,.35) 3px
      );
    mix-blend-mode: multiply;
  }

  .content {
    width: min(100%, 470px);
    text-align: center;
    position: relative;
    z-index: 5;
  }

  .eyebrow {
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: .25em;
    font-size: 10px;
    color: var(--blue);
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(42px, 12vw, 66px);
    line-height: .95;
    font-weight: 400;
    letter-spacing: -.04em;
  }

  .subtitle {
    margin-top: 13px;
    font-size: 15px;
    font-style: italic;
    color: var(--blue);
  }

  .mirror-wrap {
    width: min(74vw, 300px);
    height: min(86vw, 370px);
    margin: 30px auto 22px;
    position: relative;
    cursor: pointer;
    touch-action: none;
  }

  .mirror-shadow {
    position: absolute;
    width: 72%;
    height: 22px;
    bottom: -12px;
    left: 14%;
    background: rgba(24,50,74,.16);
    filter: blur(15px);
    border-radius: 50%;
  }

  .mirror-frame {
    position: absolute;
    inset: 0;
    border-radius: 50% 50% 45% 45% / 40% 40% 48% 48%;
    background:
      linear-gradient(135deg, #c9a940, #f1d56c 28%, #b99734 58%, #ead16c 82%, #a88629);
    padding: 10px;
    box-shadow:
      0 20px 45px rgba(24,50,74,.17),
      inset 0 0 0 1px rgba(255,255,255,.55);
  }

  .mirror {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 35% 25%, rgba(255,255,255,.45), transparent 20%),
      linear-gradient(145deg, #dbe6e9, #b8cbd2 42%, #8ca8b6);
    border: 2px solid rgba(255,255,255,.6);
    box-shadow:
      inset 0 0 35px rgba(24,50,74,.18),
      inset 0 0 80px rgba(255,255,255,.28);
  }

  /* Photo revealed after the mirror is wiped */
  .mirror-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 6;
    display: block;
  }

  .mirror-photo.show {
    opacity: 1;
  }

  .photo-error {
    position: absolute;
    inset: 0;
    z-index: 7;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: var(--navy);
    background: rgba(255,253,248,.92);
  }

  .photo-error.show {
    display: flex;
  }

  .reflection {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .9s ease;
  }

  .reflection.show {
    opacity: 1;
  }

  .reflection-head {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(24,50,74,.22);
    left: 50%;
    top: 24%;
    transform: translateX(-50%);
  }

  .reflection-body {
    position: absolute;
    width: 130px;
    height: 170px;
    border-radius: 65px 65px 18px 18px;
    background: rgba(24,50,74,.19);
    left: 50%;
    top: 42%;
    transform: translateX(-50%);
  }

  .reflection-shine {
    position: absolute;
    width: 50px;
    height: 170px;
    left: 16%;
    top: 8%;
    background: rgba(255,255,255,.22);
    transform: rotate(22deg);
    filter: blur(4px);
    border-radius: 50%;
  }

  .fog {
    position: absolute;
    inset: -10%;
    z-index: 5;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.86), transparent 28%),
      radial-gradient(circle at 70% 65%, rgba(255,255,255,.82), transparent 32%),
      radial-gradient(circle at 45% 85%, rgba(255,255,255,.75), transparent 25%),
      rgba(239,242,240,.72);
    backdrop-filter: blur(5px);
    transition: opacity .8s ease;
  }

  .fog.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .mirror-message {
    position: absolute;
    z-index: 8;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
  }

  .mirror-message.show {
    opacity: 1;
  }

  .mirror-message span {
    font-size: 21px;
    font-style: italic;
    color: rgba(24,50,74,.82);
    text-shadow: 0 1px 3px rgba(255,255,255,.7);
  }

  .instruction {
    min-height: 22px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--blue);
    transition: opacity .4s ease;
  }

  .instruction.fade {
    opacity: 0;
  }

  .action {
    margin-top: 20px;
    min-height: 48px;
    display: flex;
    justify-content: center;
  }

  .btn {
    border: 1px solid rgba(24,50,74,.28);
    background: rgba(255,253,248,.7);
    color: var(--navy);
    padding: 12px 23px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .25s ease;
    box-shadow: 0 8px 20px rgba(24,50,74,.07);
  }

  .btn:hover,
  .btn:active {
    background: var(--navy);
    color: white;
    transform: translateY(-2px);
  }

  .hidden {
    display: none !important;
  }

  /* Duck */

  .duck {
    position: fixed;
    z-index: 12;
    font-size: 37px;
    left: -70px;
    bottom: 16%;
    pointer-events: none;
    opacity: 0;
  }

  .duck.run {
    opacity: 1;
    animation: duckRun 2.4s ease-in-out forwards;
  }

  @keyframes duckRun {
    0% {
      left: -70px;
      transform: rotate(-7deg);
    }
    35% {
      transform: translateY(-13px) rotate(5deg);
    }
    60% {
      transform: translateY(0) rotate(-4deg);
    }
    100% {
      left: calc(100% + 70px);
      transform: rotate(5deg);
    }
  }

  /* Sparkles */

  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    font-size: 13px;
    animation: floatSparkle 5s ease-in-out infinite;
    opacity: .7;
  }

  @keyframes floatSparkle {
    0%, 100% {
      transform: translateY(0) rotate(0deg);
      opacity: .25;
    }
    50% {
      transform: translateY(-16px) rotate(20deg);
      opacity: .9;
    }
  }

  /* Hearts */

  .heart {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    animation: heartFloat 4s ease-out forwards;
    font-size: 17px;
  }

  @keyframes heartFloat {
    0% {
      transform: translateY(0) scale(.7);
      opacity: 0;
    }
    20% {
      opacity: .85;
    }
    100% {
      transform: translateY(-130px) scale(1.1);
      opacity: 0;
    }
  }

  /* Final screen */

  .final-screen {
    position: fixed;
    inset: 0;
    z-index: 30;
    background:
      radial-gradient(circle at center, rgba(255,255,255,.96), rgba(247,243,234,.98));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  .final-screen.show {
    opacity: 1;
    pointer-events: auto;
  }

  .final-card {
    width: min(100%, 440px);
    text-align: center;
    transform: translateY(18px);
    transition: transform 1s ease;
  }

  .final-screen.show .final-card {
    transform: translateY(0);
  }

  .final-small {
    font-family: Arial, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .25em;
    color: var(--blue);
    margin-bottom: 20px;
  }

  .final-card h2 {
    font-size: clamp(35px, 10vw, 58px);
    line-height: 1;
    font-weight: 400;
    margin-bottom: 25px;
  }

  .final-card p {
    font-size: 17px;
    line-height: 1.75;
    color: var(--blue);
  }

  .final-signature {
    margin-top: 28px;
    font-style: italic;
    font-size: 18px;
    color: var(--navy);
  }

  .final-duck {
    font-size: 42px;
    margin-top: 22px;
    animation: duckBounce 2s ease-in-out infinite;
  }

  @keyframes duckBounce {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-8px);
    }
  }

  .restart {
    margin-top: 28px;
    background: transparent;
    border: 0;
    color: var(--blue);
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: .7;
  }

  @media (max-height: 700px) {
    .mirror-wrap {
      width: 210px;
      height: 275px;
      margin-top: 20px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 43px;
    }

    .subtitle {
      margin-top: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<body>

<div class="grain"></div>

<div class="sparkle" style="top:12%;left:14%;animation-delay:.4s;">✦</div>
<div class="sparkle" style="top:24%;right:13%;animation-delay:1.8s;">✧</div>
<div class="sparkle" style="bottom:18%;left:11%;animation-delay:2.6s;">✦</div>
<div class="sparkle" style="bottom:28%;right:16%;animation-delay:1.1s;">✧</div>

<div class="duck" id="duck">🐥</div>

<main class="page" id="mainPage">
  <section class="content">

    <div class="eyebrow">A little something</div>

    <h1>The Mirror</h1>

    <p class="subtitle" id="subtitle">
      Look closer.
    </p>

    <div class="mirror-wrap" id="mirrorWrap">

      <div class="mirror-shadow"></div>

      <div class="mirror-frame">
        <div class="mirror">

          <img
            class="mirror-photo"
            id="mirrorPhoto"
            src="baby/baby.jpeg"
            alt="Baby"
          >
          <div class="photo-error" id="photoError">Foto baby.jpeg tidak ditemukan. Pastikan folder <b>baby</b> sejajar dengan index.html.</div>

          <div class="reflection" id="reflection">
            <div class="reflection-shine"></div>
            <div class="reflection-head"></div>
            <div class="reflection-body"></div>
          </div>

          <div class="fog" id="fog"></div>

          <div class="mirror-message" id="mirrorMessage">
            <span id="mirrorText"></span>
          </div>

        </div>
      </div>
    </div>

    <div class="instruction" id="instruction">
      Tap the mirror
    </div>

    <div class="action">
      <button class="btn hidden" id="actionBtn"></button>
    </div>

  </section>
</main>

<div class="final-screen" id="finalScreen">
  <div class="final-card">

    <div class="final-small">One last thing</div>

    <h2>There you are.</h2>

    <p>
      Don't get too used to seeing yourself in a screen.
      <br><br>
      I'll be much happier seeing you in person.
    </p>

    <div class="final-signature">— Fishbin</div>

    <div class="final-duck">🐥 💛</div>

    <button class="restart" id="restartBtn">
      Look again
    </button>

  </div>
</div>

<script>
  const mirrorWrap = document.getElementById("mirrorWrap");
  const fog = document.getElementById("fog");
  const reflection = document.getElementById("reflection");
  const mirrorPhoto = document.getElementById("mirrorPhoto");
  const photoError = document.getElementById("photoError");
  const mirrorMessage = document.getElementById("mirrorMessage");
  const mirrorText = document.getElementById("mirrorText");
  const instruction = document.getElementById("instruction");
  const subtitle = document.getElementById("subtitle");
  const actionBtn = document.getElementById("actionBtn");
  const duck = document.getElementById("duck");
  const finalScreen = document.getElementById("finalScreen");
  const restartBtn = document.getElementById("restartBtn");

  let stage = 0;
  let wiping = false;
  let wipedPoints = 0;

  // Coba beberapa lokasi umum agar foto tetap muncul meski nama folder sedikit berbeda.
  const photoCandidates = [
    "baby/baby.jpeg",
    "./baby/baby.jpeg",
    "babt/baby.jpeg",
    "./babt/baby.jpeg",
    "baby.jpeg",
    "./baby.jpeg"
  ];
  let photoCandidateIndex = 0;
  let photoLoaded = false;

  function tryLoadBabyPhoto() {
    if (photoCandidateIndex >= photoCandidates.length) {
      photoLoaded = false;
      return;
    }
    mirrorPhoto.src = photoCandidates[photoCandidateIndex++];
  }

  mirrorPhoto.addEventListener("load", () => {
    photoLoaded = true;
    photoError.classList.remove("show");
    console.log("Baby photo loaded:", mirrorPhoto.src);
  });

  mirrorPhoto.addEventListener("error", () => {
    tryLoadBabyPhoto();
  });

  tryLoadBabyPhoto();

  const messages = [
    "Still looking?",
    "Nope. Not quite.",
    "You're getting warmer."
  ];

  function createHeart(x, y) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > .5 ? "💙" : "💛";

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 4000);
  }

  function createSparkles() {
    for (let i = 0; i < 9; i++) {
      setTimeout(() => {
        const s = document.createElement("div");
        s.className = "heart";
        s.textContent = "✦";
        s.style.fontSize = (8 + Math.random() * 10) + "px";
        s.style.left = (25 + Math.random() * 50) + "%";
        s.style.top = (25 + Math.random() * 45) + "%";
        document.body.appendChild(s);

        setTimeout(() => s.remove(), 3500);
      }, i * 120);
    }
  }

  function showButton(text) {
    actionBtn.textContent = text;
    actionBtn.classList.remove("hidden");
  }

  function hideButton() {
    actionBtn.classList.add("hidden");
  }

  function nextStage() {
    stage++;

    hideButton();

    if (stage === 1) {
      mirrorText.textContent = messages[0];
      mirrorMessage.classList.add("show");

      instruction.textContent = "Tap again";
      subtitle.textContent = "Something is hiding in the glass.";

      createHeart(
        window.innerWidth / 2 - 10,
        window.innerHeight / 2
      );

    } else if (stage === 2) {
      mirrorText.textContent = messages[1];

      instruction.textContent = "One more time";
      subtitle.textContent = "Keep looking.";

      duck.classList.remove("run");
      void duck.offsetWidth;
      duck.classList.add("run");

      createHeart(
        window.innerWidth / 2 + 30,
        window.innerHeight / 2 + 20
      );

    } else if (stage === 3) {
      mirrorMessage.classList.remove("show");

      fog.classList.remove("hidden");

      instruction.textContent = "Wipe the mirror";
      subtitle.textContent = "Some things need a little clearing up.";

      showButton("Done");

    } else if (stage === 4) {
      fog.classList.add("hidden");
      reflection.classList.remove("show");
      mirrorPhoto.classList.add("show");
      if (!photoLoaded) photoError.classList.add("show");

      mirrorText.textContent = "There you are.";
      mirrorMessage.classList.add("show");

      instruction.textContent = "You found it.";
      subtitle.textContent = "Or perhaps it found you.";

      createSparkles();

      setTimeout(() => {
        showButton("One last thing");
      }, 1000);
    } else if (stage === 5) {
      finalScreen.classList.add("show");
      createSparkles();
    }
  }

  mirrorWrap.addEventListener("click", (e) => {
    if (stage < 3) {
      nextStage();
    }
  });

  actionBtn.addEventListener("click", () => {
    if (stage === 3) {
      nextStage();
    } else if (stage === 4) {
      nextStage();
    }
  });

  function getPointerPosition(event) {
    const rect = mirrorWrap.getBoundingClientRect();

    const touch = event.touches ? event.touches[0] : event;

    return {
      x: touch.clientX - rect.left,
      y: touch.clientY - rect.top
    };
  }

  function wipe(event) {
    if (stage !== 3) return;

    event.preventDefault();

    const pos = getPointerPosition(event);

    const circle = document.createElement("div");

    circle.style.position = "absolute";
    circle.style.width = "70px";
    circle.style.height = "70px";
    circle.style.borderRadius = "50%";
    circle.style.left = (pos.x - 35) + "px";
    circle.style.top = (pos.y - 35) + "px";
    circle.style.background = "transparent";
    circle.style.boxShadow = "0 0 0 1000px transparent";
    circle.style.pointerEvents = "none";

    fog.style.maskImage = "radial-gradient(circle at " +
      pos.x + "px " + pos.y + "px, transparent 35px, black 55px)";
    fog.style.webkitMaskImage = "radial-gradient(circle at " +
      pos.x + "px " + pos.y + "px, transparent 35px, black 55px)";

    wipedPoints++;

    if (wipedPoints > 13) {
      fog.style.opacity = ".18";
    }
  }

  mirrorWrap.addEventListener("touchstart", (e) => {
    wiping = true;
    wipe(e);
  }, { passive: false });

  mirrorWrap.addEventListener("touchmove", (e) => {
    if (wiping) wipe(e);
  }, { passive: false });

  mirrorWrap.addEventListener("touchend", () => {
    wiping = false;
  });

  mirrorWrap.addEventListener("mousedown", () => {
    wiping = true;
  });

  mirrorWrap.addEventListener("mousemove", (e) => {
    if (wiping) wipe(e);
  });

  window.addEventListener("mouseup", () => {
    wiping = false;
  });

  restartBtn.addEventListener("click", () => {
    stage = 0;
    wipedPoints = 0;

    finalScreen.classList.remove("show");
    reflection.classList.remove("show");
    mirrorPhoto.classList.remove("show");
    photoError.classList.remove("show");
    mirrorMessage.classList.remove("show");

    fog.classList.remove("hidden");
    fog.style.opacity = "1";
    fog.style.maskImage = "";
    fog.style.webkitMaskImage = "";

    subtitle.textContent = "Look closer.";
    instruction.textContent = "Tap the mirror";

    hideButton();

    duck.classList.remove("run");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
</script>

</body>
</html>
